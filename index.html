<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <title>Habit Tracker</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Firebase SDKs (CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(226, 232, 240, 0.85);
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0ea5e9;
      --fire: #f97316;
      --ice: #94a3b8;
      --success: #10b981;
      --danger: #f43f5e;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body { 
      background: radial-gradient(circle at top right, #f1f5f9 0%, #f8fafc 100%);
      color: var(--text); 
      padding: env(safe-area-inset-top, 24px) 16px calc(env(safe-area-inset-bottom, 24px) + 75px) 16px; 
      min-height: 100vh; 
    }

    .rainbow-shimmer {
      background: linear-gradient(
        120deg, 
        #6366f1 0%, 
        #ec4899 25%, 
        #f59e0b 50%, 
        #10b981 75%, 
        #06b6d4 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowFlow 5s linear infinite;
      filter: drop-shadow(0 2px 8px rgba(99, 102, 241, 0.15));
      letter-spacing: -0.03em;
    }

    @keyframes rainbowFlow {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* Header & Thanh Auth */
    .hero-header {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.04);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hero-header h1 {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.25;
    }
    .hero-header .date-str {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      margin-top: 6px;
      text-transform: capitalize;
    }

    /* Nút Đăng nhập & Avatar */
    .auth-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
    }
    .auth-btn:active { transform: scale(0.95); }
    .user-profile {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #38bdf8;
    }

    /* Bảng xếp hạng */
    .leaderboard-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(253, 224, 71, 0.4);
      border-radius: 22px;
      padding: 16px 18px;
      margin-bottom: 22px;
      box-shadow: 0 12px 28px -8px rgba(245, 158, 11, 0.08);
    }
    .leaderboard-title {
      font-size: 0.95rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .leaderboard-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #ffffff;
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: 14px;
    }
    .rank-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #1e293b;
      font-size: 0.88rem;
    }
    .rank-pos {
      font-size: 1rem;
      width: 22px;
      text-align: center;
    }

    .streak-badge { 
      padding: 4px 10px; 
      border-radius: 20px; 
      font-weight: 700; 
      font-size: 0.82rem; 
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .streak-badge.active {
      background: #fff7ed; 
      color: var(--fire); 
      border: 1px solid #ffedd5;
    }
    .streak-badge.frozen {
      background: #f1f5f9; 
      color: var(--ice);
      border: 1px dashed var(--ice);
    }

    /* Card chủ đề */
    .card { 
      background: #ffffff; 
      border: 1px solid var(--card-border); 
      border-radius: 22px; 
      padding: 18px; 
      margin-bottom: 18px; 
      box-shadow: 0 8px 24px -6px rgba(15, 23, 42, 0.03); 
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .topic-title-row { display: flex; align-items: center; gap: 8px; flex: 1; margin-right: 8px; }

    .topic-card-badge {
      background: #0f172a;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 1.02rem;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.15);
      border: 1px solid #334155;
      display: inline-block;
      max-width: 80%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-actions { display: flex; align-items: center; gap: 6px; }
    
    .btn-add-task {
      background: #eff6ff;
      color: #0284c7;
      border: 1px solid #bae6fd;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 600;
      line-height: 1;
    }
    .btn-add-task:active { transform: scale(0.92); }

    .btn-icon { background: none; border: none; color: #94a3b8; font-size: 0.95rem; cursor: pointer; padding: 4px 6px; border-radius: 8px; }
    .btn-icon:hover { color: var(--text); background: #f1f5f9; }
    .btn-icon.delete:hover { color: var(--danger); }

    .task-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
    .task-item { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      background: #ffffff; 
      border: 1px solid #e2e8f0; 
      padding: 10px 12px; 
      border-radius: 14px; 
      gap: 8px; 
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
    }
    .task-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; flex-wrap: wrap; }
    
    .task-name-pill {
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      word-break: break-word;
    }

    .target-badge { 
      background: #eff6ff; 
      color: #2563eb; 
      padding: 3px 9px; 
      border-radius: 8px; 
      font-weight: 800; 
      font-size: 0.8rem; 
      border: 1px solid #bfdbfe;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .task-item input[type="checkbox"] { width: 20px; height: 20px; min-width: 20px; accent-color: var(--success); cursor: pointer; border-radius: 6px; }
    .task-item.completed .task-name-pill { text-decoration: line-through; color: #94a3b8; background: #f8fafc; border-color: #e2e8f0; }
    .task-item.completed .target-badge { opacity: 0.5; }
    
    .btn-more {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      line-height: 1;
    }
    .btn-more:hover { color: var(--text); background: #f1f5f9; }
    
    .status-msg { font-size: 0.78rem; font-weight: 600; margin-top: 8px; color: var(--muted); text-align: right; }
    .empty-state { text-align: center; color: var(--muted); padding: 50px 16px; border: 1.5px dashed #cbd5e1; border-radius: 22px; margin-bottom: 20px; font-size: 0.92rem; font-weight: 500; line-height: 1.6; background: #ffffff; }
    
    .fab-btn {
      position: fixed;
      right: 20px;
      bottom: calc(env(safe-area-inset-bottom, 20px) + 16px);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
      color: #ffffff;
      border: none;
      font-size: 2rem;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
      cursor: pointer;
      z-index: 100;
      user-select: none;
      transition: transform 0.15s ease;
    }
    .fab-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <header class="hero-header">
    <div class="header-top">
      <h1><span class="rainbow-shimmer">⚡ Theo dõi Chuỗi Mục tiêu</span></h1>
      <div id="authContainer">
        <button class="auth-btn" onclick="loginGoogle()">Đăng nhập</button>
      </div>
    </div>
    <div class="date-str" id="currentDate"></div>
  </header>

  <div class="leaderboard-card" id="leaderboardSection" style="display: none;">
    <div class="leaderboard-title">
      <span class="rainbow-shimmer">🏆 Bảng Xếp Hạng Chuỗi</span>
      <span style="font-size: 0.75rem; color: var(--muted); font-weight: 600;">Top Chuỗi Dài Nhất</span>
    </div>
    <div class="leaderboard-list" id="leaderboardList"></div>
  </div>

  <div id="topicsContainer"></div>

  <button class="fab-btn" title="Thêm chủ đề mới" onclick="promptAddTopic()">+</button>

  <script>
    // --- 1. CẤU HÌNH FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyCf2UU60vwjb8my6Hw6y6S4a6-VbK5rwFc",
      authDomain: "daily-a9522.firebaseapp.com",
      projectId: "daily-a9522",
      storageBucket: "daily-a9522.firebasestorage.app",
      messagingSenderId: "438646081063",
      appId: "1:438646081063:web:76098b937679eb45f37002",
      measurementId: "G-YMMWP41KN7"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let unsubscribeSnapshot = null;

    // --- 2. QUẢN LÝ DỮ LIỆU & STATE ---
    function getDiffDays(dateStr1, dateStr2) {
      if (!dateStr1 || !dateStr2) return 999;
      const d1 = new Date(dateStr1);
      const d2 = new Date(dateStr2);
      const diffTime = Math.abs(d2 - d1);
      return Math.round(diffTime / (1000 * 60 * 60 * 24));
    }

    const getTodayStr = () => new Date().toISOString().split('T')[0];

    let state = JSON.parse(localStorage.getItem('habit_user_topics_v2')) || [];
    let lastActiveDay = localStorage.getItem('habit_last_active_day_v2') || getTodayStr();

    function checkDailyReset() {
      const today = getTodayStr();
      if (lastActiveDay !== today) {
        state.forEach(topic => {
          topic.tasks.forEach(t => t.done = false);

          if (topic.lastCompletedDate) {
            const daysSinceLast = getDiffDays(topic.lastCompletedDate, today);
            if (daysSinceLast > 2) {
              topic.streak = 0;
            }
          }
        });
        lastActiveDay = today;
        saveData();
      }
    }

    // Tự động lưu: Vừa lưu localStorage (để dùng offline), vừa đồng bộ Cloud nếu đã đăng nhập
    function saveData() {
      localStorage.setItem('habit_user_topics_v2', JSON.stringify(state));
      localStorage.setItem('habit_last_active_day_v2', lastActiveDay);

      if (currentUser) {
        db.collection("users").doc(currentUser.uid).set({
          topics: state,
          lastActiveDay: lastActiveDay,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
      }
    }

    // --- 3. ĐỒNG BỘ TÀI KHOẢN GOOGLE ---
    auth.onAuthStateChanged(user => {
      currentUser = user;
      const authBox = document.getElementById('authContainer');

      if (user) {
        authBox.innerHTML = `
          <div class="user-profile">
            <img src="${user.photoURL || 'https://via.placeholder.com/32'}" class="user-avatar" title="${user.displayName}">
            <button class="btn-icon" title="Đăng xuất" onclick="logoutGoogle()">🚪</button>
          </div>
        `;

        // Lắng nghe dữ liệu Realtime từ Cloud
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        unsubscribeSnapshot = db.collection("users").doc(user.uid).onSnapshot(doc => {
          if (doc.exists) {
            const data = doc.data();
            if (data.topics) {
              state = data.topics;
              lastActiveDay = data.lastActiveDay || getTodayStr();
              localStorage.setItem('habit_user_topics_v2', JSON.stringify(state));
              localStorage.setItem('habit_last_active_day_v2', lastActiveDay);
              checkDailyReset();
              render();
            }
          } else {
            // Lần đầu đăng nhập thì đẩy dữ liệu đang có trên máy lên Cloud
            saveData();
          }
        });
      } else {
        authBox.innerHTML = `<button class="auth-btn" onclick="loginGoogle()">Đăng nhập</button>`;
        if (unsubscribeSnapshot) {
          unsubscribeSnapshot();
          unsubscribeSnapshot = null;
        }
      }
    });

    function loginGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => {
        // Hỗ trợ trường hợp Safari chặn Popup thì dùng Redirect
        if (err.code === 'auth/popup-blocked' || err.code === 'auth/popup-closed-by-user') {
          auth.signInWithRedirect(provider);
        } else {
          alert("Lỗi đăng nhập: " + err.message);
        }
      });
    }

    function logoutGoogle() {
      if (confirm("Bạn có muốn đăng xuất không?")) {
        auth.signOut();
      }
    }

    // --- 4. CÁC TÁC VỤ VỚI TOPIC & NHIỆM VỤ ---
    function promptAddTopic() {
      const name = prompt("Nhập tên chủ đề mới (VD: Sức khỏe, Luyện code, Tiếng Anh...):");
      if (name !== null && name.trim() !== "") {
        state.push({
          id: 'topic_' + Date.now(),
          name: name.trim(),
          streak: 0,
          lastCompletedDate: null,
          tasks: []
        });
        saveData();
        render();
      }
    }

    function editTopicName(topicId) {
      const topic = state.find(t => t.id === topicId);
      const newName = prompt("Chỉnh sửa tên chủ đề:", topic.name);
      if (newName !== null && newName.trim() !== "") {
        topic.name = newName.trim();
        saveData();
        render();
      }
    }

    function deleteTopic(topicId) {
      if (confirm("Bạn có chắc chắn muốn xoá chủ đề này và toàn bộ dữ liệu chuỗi không?")) {
        state = state.filter(t => t.id !== topicId);
        saveData();
        render();
      }
    }

    function promptAddTask(topicId) {
      const name = prompt("1/3. Tên việc cần làm (VD: Hít đất, Chạy bộ, Luyện C++):");
      if (!name || !name.trim()) return;

      const valInput = prompt(`2/3. Số lượng mục tiêu cho "${name.trim()}":`, "10");
      if (valInput === null) return;
      const targetValue = parseFloat(valInput.trim());
      if (isNaN(targetValue) || targetValue <= 0) {
        alert("Số lượng không hợp lệ!");
        return;
      }

      const unit = prompt(`3/3. Đơn vị tính (VD: cái, km, bài, phút):`, "cái");
      if (!unit || !unit.trim()) return;

      const topic = state.find(t => t.id === topicId);
      topic.tasks.push({
        id: 'task_' + Date.now(),
        name: name.trim(),
        targetValue: targetValue,
        unit: unit.trim(),
        done: false
      });

      saveData();
      render();
    }

    function openTaskMenu(topicId, taskId) {
      const topic = state.find(t => t.id === topicId);
      const task = topic.tasks.find(t => t.id === taskId);
      
      const choice = prompt(
        `Tuỳ chọn cho "${task.name}":\n` +
        `1. Thay đổi số lượng (${task.targetValue} -> mới)\n` +
        `2. Xoá nhiệm vụ này\n\n` +
        `Nhập số 1 hoặc 2:`, "1"
      );

      if (choice === "1") {
        const input = prompt(`Nhập số lượng mới cho "${task.name}" (${task.unit}):`, task.targetValue);
        if (input !== null) {
          const newVal = parseFloat(input.trim());
          if (!isNaN(newVal) && newVal > 0) {
            task.targetValue = newVal;
            saveData();
            render();
          } else {
            alert("Số không hợp lệ!");
          }
        }
      } else if (choice === "2") {
        if (confirm(`Bạn có chắc muốn xoá "${task.name}"?`)) {
          topic.tasks = topic.tasks.filter(t => t.id !== taskId);
          saveData();
          render();
        }
      }
    }

    function toggleTask(topicId, taskId) {
      const topic = state.find(t => t.id === topicId);
      const task = topic.tasks.find(t => t.id === taskId);
      task.done = !task.done;

      const allDone = topic.tasks.length > 0 && topic.tasks.every(t => t.done);
      const today = getTodayStr();

      if (allDone) {
        if (topic.lastCompletedDate !== today) {
          const daysSinceLast = topic.lastCompletedDate ? getDiffDays(topic.lastCompletedDate, today) : 999;
          
          if (daysSinceLast === 1 || daysSinceLast === 2) {
            topic.streak += 1;
          } else {
            topic.streak = 1;
          }
          topic.lastCompletedDate = today;
        }
      }
      saveData();
      render();
    }

    function getStreakStatus(topic) {
      const today = getTodayStr();
      if (!topic.lastCompletedDate || topic.streak === 0) {
        return { isFrozen: false, text: `🔥 ${topic.streak} ngày`, badgeClass: "active" };
      }

      const daysSinceLast = getDiffDays(topic.lastCompletedDate, today);

      if (daysSinceLast === 0 || daysSinceLast === 1) {
        return { isFrozen: false, text: `🔥 ${topic.streak} ngày`, badgeClass: "active" };
      } else if (daysSinceLast === 2) {
        return { isFrozen: true, text: `❄️ ${topic.streak} ngày (Cần cứu)`, badgeClass: "frozen" };
      } else {
        return { isFrozen: false, text: `🔥 0 ngày`, badgeClass: "active" };
      }
    }

    function renderLeaderboard() {
      const leaderboardCard = document.getElementById('leaderboardSection');
      const leaderboardList = document.getElementById('leaderboardList');

      if (state.length === 0) {
        leaderboardCard.style.display = 'none';
        return;
      }

      leaderboardCard.style.display = 'block';

      const sortedTopics = [...state].sort((a, b) => b.streak - a.streak);
      const medals = ['🥇', '🥈', '🥉'];

      leaderboardList.innerHTML = sortedTopics.map((t, idx) => {
        const rankDisplay = idx < 3 ? medals[idx] : `#${idx + 1}`;
        const status = getStreakStatus(t);
        return `
          <div class="leaderboard-item">
            <div class="rank-left">
              <span class="rank-pos">${rankDisplay}</span>
              <span>${t.name}</span>
            </div>
            <div class="streak-badge ${status.badgeClass}">${status.text}</div>
          </div>
        `;
      }).join('');
    }

    function render() {
      renderLeaderboard();

      const container = document.getElementById('topicsContainer');
      container.innerHTML = '';

      if (state.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            Chưa có chủ đề nào.<br>Bấm vào nút <b>+</b> ở góc dưới để tạo chủ đề đầu tiên!
          </div>
        `;
        return;
      }

      state.forEach(topic => {
        const hasTasks = topic.tasks.length > 0;
        const isAllDone = hasTasks && topic.tasks.every(t => t.done);
        const card = document.createElement('div');
        card.className = 'card';

        const status = getStreakStatus(topic);

        const tasksHtml = topic.tasks.map(t => `
          <div class="task-item ${t.done ? 'completed' : ''}">
            <div class="task-left" onclick="toggleTask('${topic.id}', '${t.id}')">
              <input type="checkbox" ${t.done ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask('${topic.id}', '${t.id}')">
              <span class="task-name-pill">${t.name}</span>
              <span class="target-badge">
                ${t.targetValue} ${t.unit}
              </span>
            </div>
            <button class="btn-more" title="Tuỳ chọn" onclick="openTaskMenu('${topic.id}', '${t.id}')">⋯</button>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="card-header">
            <div class="topic-title-row">
              <div class="topic-card-badge">${topic.name}</div>
              <button class="btn-icon" title="Đổi tên chủ đề" onclick="editTopicName('${topic.id}')">✏️</button>
            </div>
            <div class="header-actions">
              <div class="streak-badge ${status.badgeClass}">${status.text}</div>
              <button class="btn-add-task" title="Thêm nhiệm vụ" onclick="promptAddTask('${topic.id}')">+</button>
              <button class="btn-icon delete" title="Xoá chủ đề" onclick="deleteTopic('${topic.id}')">🗑</button>
            </div>
          </div>

          <div class="task-list">
            ${hasTasks ? tasksHtml : '<div style="color: var(--muted); font-size: 0.85rem; padding: 4px 0;">Chưa có việc nào. Bấm nút <b>+</b> bên trên để thêm!</div>'}
          </div>

          <div class="status-msg">
            ${isAllDone ? "✅ Đã hoàn thành tất cả mục tiêu hôm nay!" : (status.isFrozen ? "⚠️ Chuỗi đang bị đóng băng xám! Hãy hoàn thành để cứu." : (hasTasks ? "Chưa xong hết các mục tiêu" : "Hãy thêm nhiệm vụ để tính chuỗi"))}
          </div>
        `;
        container.appendChild(card);
      });
    }

    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('vi-VN', { 
      weekday: 'long', 
      year: 'numeric', 
      month: 'numeric', 
      day: 'numeric' 
    });

    checkDailyReset();
    render();
  </script>
</body>
</html>
