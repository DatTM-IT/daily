<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <title>Habit Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --fire: #f97316;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background: var(--bg); 
      color: var(--text); 
      padding: env(safe-area-inset-top, 20px) 16px calc(env(safe-area-inset-bottom, 20px) + 70px) 16px; 
      min-height: 100vh; 
    }
    header { margin-bottom: 20px; padding-top: 10px; }
    h1 { font-size: 1.5rem; font-weight: 700; }
    .date-str { color: var(--muted); font-size: 0.85rem; margin-top: 4px; text-transform: capitalize; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .topic-title-row { display: flex; align-items: center; gap: 8px; flex: 1; margin-right: 8px; }
    .topic-name { font-size: 1.15rem; font-weight: 600; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .streak-badge { background: rgba(249, 115, 22, 0.15); color: var(--fire); padding: 4px 10px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
    
    .btn-icon { background: none; border: none; color: var(--muted); font-size: 0.95rem; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
    .btn-icon:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .btn-icon.delete:hover { color: var(--danger); }

    .task-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); padding: 10px 12px; border-radius: 10px; gap: 8px; }
    .task-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .task-text { word-break: break-word; font-size: 0.95rem; }
    .target-badge { background: rgba(56, 189, 248, 0.15); color: var(--primary); padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }
    .task-item input[type="checkbox"] { width: 20px; height: 20px; min-width: 20px; accent-color: var(--success); cursor: pointer; }
    .task-item.completed .task-text { text-decoration: line-through; color: var(--muted); }
    .task-item.completed .target-badge { opacity: 0.6; }
    
    .task-actions { display: flex; align-items: center; gap: 2px; }

    .add-task-form { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .inputs-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 6px; }
    .input-box { background: rgba(0,0,0,0.25); border: 1px solid var(--border); color: var(--text); padding: 9px 10px; border-radius: 10px; font-size: 0.88rem; outline: none; width: 100%; }
    .input-box:focus { border-color: var(--primary); }
    .btn-submit-task { background: var(--border); color: var(--text); border: none; padding: 10px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.88rem; }
    
    .status-msg { font-size: 0.8rem; margin-top: 10px; color: var(--muted); text-align: right; }
    .empty-state { text-align: center; color: var(--muted); padding: 60px 16px; border: 1px dashed var(--border); border-radius: 16px; margin-bottom: 20px; font-size: 0.95rem; line-height: 1.6; }
    
    /* Nút + nổi ở góc màn hình */
    .fab-btn {
      position: fixed;
      right: 20px;
      bottom: calc(env(safe-area-inset-bottom, 20px) + 15px);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--primary);
      color: #0f172a;
      border: none;
      font-size: 2rem;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
      cursor: pointer;
      z-index: 100;
      user-select: none;
      transition: transform 0.1s ease;
    }
    .fab-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <header>
    <h1>Theo dõi Chuỗi Mục tiêu</h1>
    <div class="date-str" id="currentDate"></div>
  </header>

  <!-- Danh sách các Chủ đề -->
  <div id="topicsContainer"></div>

  <!-- Nút + thêm chủ đề dạng nổi góc dưới màn hình -->
  <button class="fab-btn" title="Thêm chủ đề mới" onclick="promptAddTopic()">+</button>

  <script>
    const getTodayStr = () => new Date().toISOString().split('T')[0];
    const getYesterdayStr = () => {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return d.toISOString().split('T')[0];
    };

    let state = JSON.parse(localStorage.getItem('habit_user_topics_v2')) || [];
    let lastActiveDay = localStorage.getItem('habit_last_active_day_v2') || getTodayStr();

    function checkDailyReset() {
      const today = getTodayStr();
      if (lastActiveDay !== today) {
        state.forEach(topic => {
          topic.tasks.forEach(t => t.done = false);
          if (topic.lastCompletedDate && topic.lastCompletedDate < getYesterdayStr()) {
            topic.streak = 0;
          }
        });
        lastActiveDay = today;
        saveData();
      }
    }

    function saveData() {
      localStorage.setItem('habit_user_topics_v2', JSON.stringify(state));
      localStorage.setItem('habit_last_active_day_v2', lastActiveDay);
    }

    // Nhập tên chủ đề qua nút +
    function promptAddTopic() {
      const name = prompt("Nhập tên chủ đề mới (VD: Sức khỏe, Luyện code, Tiếng Anh...):");
      if (name !== null && name.trim() !== "") {
        state.push({
          id: 'topic_' + Date.now(),
          name: name.trim(),
          streak: 0,
          lastCompletedDate: null,
          tasks: []
        });
        saveData();
        render();
      }
    }

    function editTopicName(topicId) {
      const topic = state.find(t => t.id === topicId);
      const newName = prompt("Chỉnh sửa tên chủ đề:", topic.name);
      if (newName !== null && newName.trim() !== "") {
        topic.name = newName.trim();
        saveData();
        render();
      }
    }

    function deleteTopic(topicId) {
      if (confirm("Bạn có chắc chắn muốn xoá chủ đề này và toàn bộ dữ liệu chuỗi không?")) {
        state = state.filter(t => t.id !== topicId);
        saveData();
        render();
      }
    }

    function addTask(event, topicId) {
      event.preventDefault();
      const nameInput = document.getElementById(`name_${topicId}`);
      const valInput = document.getElementById(`val_${topicId}`);
      const unitInput = document.getElementById(`unit_${topicId}`);

      const name = nameInput.value.trim();
      const targetValue = parseFloat(valInput.value.trim());
      const unit = unitInput.value.trim();

      if (!name || isNaN(targetValue) || !unit) return;

      const topic = state.find(t => t.id === topicId);
      topic.tasks.push({
        id: 'task_' + Date.now(),
        name: name,
        targetValue: targetValue,
        unit: unit,
        done: false
      });

      saveData();
      render();
    }

    function editTaskTarget(topicId, taskId) {
      const topic = state.find(t => t.id === topicId);
      const task = topic.tasks.find(t => t.id === taskId);
      const input = prompt(`Cập nhật số lượng mới cho "${task.name}" (${task.unit}):`, task.targetValue);
      
      if (input !== null) {
        const newVal = parseFloat(input.trim());
        if (!isNaN(newVal) && newVal > 0) {
          task.targetValue = newVal;
          saveData();
          render();
        } else {
          alert("Vui lòng nhập một số hợp lệ!");
        }
      }
    }

    function deleteTask(topicId, taskId) {
      const topic = state.find(t => t.id === topicId);
      topic.tasks = topic.tasks.filter(t => t.id !== taskId);
      saveData();
      render();
    }

    function toggleTask(topicId, taskId) {
      const topic = state.find(t => t.id === topicId);
      const task = topic.tasks.find(t => t.id === taskId);
      task.done = !task.done;

      const allDone = topic.tasks.length > 0 && topic.tasks.every(t => t.done);
      const today = getTodayStr();

      if (allDone) {
        if (topic.lastCompletedDate !== today) {
          if (topic.lastCompletedDate === getYesterdayStr()) {
            topic.streak += 1;
          } else {
            topic.streak = 1;
          }
          topic.lastCompletedDate = today;
        }
      }
      saveData();
      render();
    }

    function render() {
      const container = document.getElementById('topicsContainer');
      container.innerHTML = '';

      if (state.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            Chưa có chủ đề nào.<br>Bấm vào nút <b>+</b> ở góc dưới để tạo chủ đề đầu tiên!
          </div>
        `;
        return;
      }

      state.forEach(topic => {
        const hasTasks = topic.tasks.length > 0;
        const isAllDone = hasTasks && topic.tasks.every(t => t.done);
        const card = document.createElement('div');
        card.className = 'card';

        const tasksHtml = topic.tasks.map(t => `
          <div class="task-item ${t.done ? 'completed' : ''}">
            <div class="task-left" onclick="toggleTask('${topic.id}', '${t.id}')">
              <input type="checkbox" ${t.done ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask('${topic.id}', '${t.id}')">
              <span class="task-text">${t.name}:</span>
              <span class="target-badge" title="Chạm để đổi số lượng" onclick="event.stopPropagation(); editTaskTarget('${topic.id}', '${t.id}')">
                ${t.targetValue} ${t.unit} ✏️
              </span>
            </div>
            <div class="task-actions">
              <button class="btn-icon delete" title="Xoá nhiệm vụ" onclick="deleteTask('${topic.id}', '${t.id}')">✕</button>
            </div>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="card-header">
            <div class="topic-title-row">
              <div class="topic-name">${topic.name}</div>
              <button class="btn-icon" title="Đổi tên chủ đề" onclick="editTopicName('${topic.id}')">✏️</button>
            </div>
            <div class="header-actions">
              <div class="streak-badge">🔥 ${topic.streak} ngày</div>
              <button class="btn-icon delete" title="Xoá chủ đề" onclick="deleteTopic('${topic.id}')">🗑</button>
            </div>
          </div>

          <div class="task-list">
            ${hasTasks ? tasksHtml : '<div style="color: var(--muted); font-size: 0.85rem; padding: 4px 0;">Chưa có nhiệm vụ nào.</div>'}
          </div>

          <form class="add-task-form" onsubmit="addTask(event, '${topic.id}')">
            <div class="inputs-grid">
              <input type="text" id="name_${topic.id}" class="input-box" placeholder="Tên việc (VD: Chạy bộ)" required>
              <input type="number" step="any" id="val_${topic.id}" class="input-box" placeholder="Số (VD: 2)" required>
              <input type="text" id="unit_${topic.id}" class="input-box" placeholder="Đơn vị (km)" required>
            </div>
            <button type="submit" class="btn-submit-task">+ Thêm nhiệm vụ</button>
          </form>

          <div class="status-msg">
            ${isAllDone ? "✅ Đã hoàn thành tất cả mục tiêu hôm nay!" : (hasTasks ? "Chưa xong hết các mục tiêu" : "Hãy thêm nhiệm vụ để tính chuỗi")}
          </div>
        `;
        container.appendChild(card);
      });
    }

    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('vi-VN', { 
      weekday: 'long', 
      year: 'numeric', 
      month: 'numeric', 
      day: 'numeric' 
    });

    checkDailyReset();
    render();
  </script>
</body>
</html>
